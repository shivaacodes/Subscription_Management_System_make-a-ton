version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: subflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-subflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-subflow} -d ${POSTGRES_DB:-subflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
